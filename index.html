<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>파이널 컷</title>
  <meta name="description" content="파이널 컷 · 7주 데일리 체크 캘린더 (9.15 – 10.31, 목표 −8kg)" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#E35B3E" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png" />

  <!-- iOS 홈 화면 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="파이널 컷" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <style>
    html, body { margin: 0; background: #FBFAF7; }
    #root { min-height: 100vh; min-height: 100dvh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React (로컬 번들 · 오프라인 동작) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <!-- 앱 (JSX 사전 컴파일본) -->
  <script src="app.js"></script>

  <!-- 서비스 워커 등록: 오프라인 캐시 + 데스크톱 설치 -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
